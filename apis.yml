description: 'TSM (Team SoloMid) is a North American esports and gaming lifestyle organization, surfaced
  as a portfolio company of Bessemer Venture Partners in the consumer sector. Its public web presence at
  tsm.gg redirects to the official TSM Store (tsmshop.com), a Shopify-hosted storefront selling TSM apparel
  and accessories. An enrichment pass on 2026-07-21 found no first-party developer API surface: no
  developer portal, no API documentation, no OpenAPI, no resolving developer/api/docs subdomains, and no
  real /.well-known/ discovery documents (every probed path returned the storefront catch-all page). This
  profile is retained as a consumer-brand lead with only domain-security signals captured.'
